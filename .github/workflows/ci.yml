name: CI

on:
  push:
    branches: [main]
  pull_request:
  # Called by release.yml, so a release only proceeds once this whole matrix is green on the tagged commit.
  workflow_call:

jobs:
  build:
    name: build (${{ matrix.os }}, opa ${{ matrix.opa }})
    runs-on: ${{ matrix.os }}
    # The latest-opa row is a canary: it reports a newer opa breaking us without blocking merges.
    continue-on-error: ${{ matrix.canary == true }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # The reference configuration: also the only row that does the publish smoke test and the
          # generated-docs drift checks (those are not OS-specific).
          - { os: ubuntu-latest, opa: '1.19.0', primary: true }
          - { os: macos-latest, opa: '1.19.0' }
          - { os: windows-latest, opa: '1.19.0' }
          - { os: ubuntu-latest, opa: 'latest', canary: true }
    defaults:
      run:
        # bash on every OS (Git Bash on Windows) so ./gradlew and the multi-line steps behave the same.
        shell: bash
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6

      # Pinned exactly, per CLAUDE.md: the acceptance pack (and its frozen goldens) was validated
      # against this exact opa version. A newer opa could silently change parse/eval output shape.
      - name: Install opa ${{ matrix.opa }}
        uses: open-policy-agent/setup-opa@v2
        with:
          version: ${{ matrix.opa }}

      - name: Confirm opa version
        run: opa version

      - name: Unit tests + Tier-1/Tier-2 acceptance tests
        run: ./gradlew check acceptanceTest --console=plain

      # Publishes the current commit's artifact to ~/.m2 so the standalone consumer-smoke-test
      # project (deliberately not a subproject of the root build -- see CLAUDE.md) can resolve it
      # the way a real external consumer would, not via Gradle project-dependency substitution.
      - name: Publish to Maven Local (for the consumer smoke test)
        if: matrix.primary
        run: ./gradlew publishToMavenLocal --console=plain

      # Applying the Dokka plugin (documentation site) would silently make the publishing plugin ship a 1 MB Dokka javadoc jar instead of the
      # empty one every release has carried; build.gradle.kts pins the empty jar, and this fails if that pin is ever lost.
      - name: Published javadoc jar is still the empty one
        if: matrix.primary
        run: |
          size=$(wc -c < ~/.m2/repository/io/github/wakaleo/explico/*/explico-*-javadoc.jar | tr -d ' ')
          echo "javadoc jar: $size bytes"
          test "$size" -lt 10000

      - name: Consumer smoke test
        if: matrix.primary
        run: ./gradlew -p consumer-smoke-test run --console=plain

      # Dogfooding drift check (spec §13.7): docs/sample-output/ is committed, generated output --
      # if a renderer change alters what samples/ produces without regenerating and committing it,
      # this step catches the divergence. Same recipe docs/user-guide.md documents for a consumer's
      # own CI, applied to this repository's own generated docs.
      - name: Regenerate sample docs and check for drift
        if: matrix.primary
        run: |
          ./gradlew generateSampleDocs --console=plain
          git diff --exit-code -- docs/sample-output

      # Same drift check for the showcase pages (docs/showcase/, built from samples/showcase/).
      - name: Regenerate showcase and check for drift
        if: matrix.primary
        run: |
          ./gradlew generateShowcase --console=plain
          git diff --exit-code -- docs/showcase

      # The jars are Java 17 bytecode (build.gradle.kts), so run the real runnable jar on the oldest JDK we
      # claim to support. The compiler already checks API use against JDK 17; this proves it actually runs.
      - name: Smoke test the runnable jar on JDK 17
        if: matrix.primary
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Run explico demo on JDK 17
        if: matrix.primary
        run: |
          java -version
          mkdir -p "$RUNNER_TEMP/demo17" && cd "$RUNNER_TEMP/demo17"
          java -jar "$GITHUB_WORKSPACE"/build/libs/explico-*-all.jar demo
