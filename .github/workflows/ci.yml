name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6

      # Pinned exactly, per CLAUDE.md: the acceptance pack (and its frozen goldens) was validated
      # against this exact opa version. A newer opa could silently change parse/eval output shape.
      - name: Install opa 1.19.0
        uses: open-policy-agent/setup-opa@v2
        with:
          version: 1.19.0

      - name: Confirm opa version
        run: opa version

      - name: Unit tests + Tier-1/Tier-2 acceptance tests
        run: ./gradlew check acceptanceTest --console=plain

      # Publishes the current commit's artifact to ~/.m2 so the standalone consumer-smoke-test
      # project (deliberately not a subproject of the root build -- see CLAUDE.md) can resolve it
      # the way a real external consumer would, not via Gradle project-dependency substitution.
      - name: Publish to Maven Local (for the consumer smoke test)
        run: ./gradlew publishToMavenLocal --console=plain

      - name: Consumer smoke test
        run: ./gradlew -p consumer-smoke-test run --console=plain

      # Dogfooding drift check (spec §13.7): docs/sample-output/ is committed, generated output --
      # if a renderer change alters what samples/ produces without regenerating and committing it,
      # this step catches the divergence. Same recipe docs/user-guide.md documents for a consumer's
      # own CI, applied to this repository's own generated docs.
      - name: Regenerate sample docs and check for drift
        run: |
          ./gradlew generateSampleDocs --console=plain
          git diff --exit-code -- docs/sample-output
