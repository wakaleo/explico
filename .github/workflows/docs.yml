# The documentation site (MkDocs Material) -> GitHub Pages.
#
# Source is docs/ plus README/ARCHITECTURE/CHANGELOG/SECURITY, staged by scripts/docs/prepare.py (links rewritten for the site).
# The build is STRICT: a broken link or anchor, or a page missing from the navigation, fails it. Every push and pull request builds;
# only a push to main publishes, and only once Pages is set to "GitHub Actions" in the repository settings (one-time):
#   gh api -X POST repos/wakaleo/explico/pages -f build_type=workflow
name: Docs

on:
  push:
    branches: [main]
    paths:
      - "docs/**"
      - "README.md"
      - "ARCHITECTURE.md"
      - "CHANGELOG.md"
      - "SECURITY.md"
      - "mkdocs.yml"
      - "scripts/docs/**"
      - ".github/workflows/docs.yml"
  pull_request:
    paths:
      - "docs/**"
      - "README.md"
      - "ARCHITECTURE.md"
      - "CHANGELOG.md"
      - "SECURITY.md"
      - "mkdocs.yml"
      - "scripts/docs/**"
      - ".github/workflows/docs.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: docs-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: scripts/docs/requirements.txt
      - name: Install the site toolchain
        run: pip install -r scripts/docs/requirements.txt
      - name: Test the link rewriter
        run: python3 -m unittest discover -s scripts/docs
      - name: Stage the documentation source
        run: python3 scripts/docs/prepare.py . build/site-src "https://github.com/${{ github.repository }}" "${{ github.sha }}"
      - name: Build the site (strict)
        run: mkdocs build --strict
      - name: Upload the site
        if: github.event_name != 'pull_request'
        uses: actions/upload-pages-artifact@v5
        with:
          path: build/site

  deploy:
    if: github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
